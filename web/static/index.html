<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PyroCast — Florida Wildfire Ignition Risk</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
  :root{ --bg:#0e1116; --panel:#161b22; --line:#272e38; --txt:#e6edf3; --muted:#8b949e;
         --red:#e5484d; --blue:#4a90e2; --accent:#ff8c42; }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--txt)}
  #map{position:absolute;top:0;left:0;right:0;bottom:0;background:#0e1116}
  .leaflet-container{background:#0e1116}
  header{position:absolute;top:0;left:0;right:0;z-index:1000;padding:12px 18px;
    background:linear-gradient(180deg,rgba(14,17,22,.95),rgba(14,17,22,0));pointer-events:none}
  header h1{margin:0;font-size:20px;font-weight:700;letter-spacing:.3px}
  header h1 .fire{color:var(--accent)}
  header .sub{margin:2px 0 0;font-size:12.5px;color:var(--muted)}
  /* legend */
  .legend{position:absolute;bottom:22px;left:18px;z-index:1000;background:var(--panel);
    border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:12px}
  .legend .bar{height:10px;width:180px;border-radius:5px;margin:6px 0 4px;
    background:linear-gradient(90deg,#1a7d3a 0%,#74bd57 50%,#cdd451 66%,#f3c63f 79%,#ee7e2b 90%,#d8342a 100%)}
  .legend .ends{display:flex;justify-content:space-between;color:var(--muted)}
  /* mode toggle */
  .modes{position:absolute;top:14px;right:18px;z-index:1000;display:flex;gap:6px;
    background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:4px}
  .modes button{background:none;border:0;color:var(--muted);padding:6px 12px;border-radius:7px;
    cursor:pointer;font-size:13px;font-weight:600}
  .modes button.on{background:var(--accent);color:#1a1109}
  /* explain panel */
  #panel{position:absolute;top:0;right:-400px;width:380px;height:100%;z-index:1001;
    background:var(--panel);border-left:1px solid var(--line);transition:right .25s ease;
    padding:20px;overflow-y:auto}
  #panel.open{right:0}
  #panel .close{float:right;cursor:pointer;color:var(--muted);font-size:22px;line-height:1;border:0;background:none}
  #panel h2{margin:0 0 2px;font-size:16px}
  #panel .loc{color:var(--muted);font-size:12.5px;margin-bottom:16px}
  .gauge{display:flex;align-items:baseline;gap:8px;margin:10px 0 4px}
  .gauge .big{font-size:46px;font-weight:800;line-height:1}
  .gauge .lab{font-size:13px;color:var(--muted)}
  .ringwrap{margin:6px 0 18px}
  .ring{height:12px;border-radius:6px;background:#0e1116;overflow:hidden}
  .ring > i{display:block;height:100%;border-radius:6px}
  .sec{font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin:18px 0 8px}
  .factor{margin:8px 0}
  .factor .row{display:flex;justify-content:space-between;font-size:13.5px;margin-bottom:3px}
  .factor .row b{font-weight:600}
  .factor .meter{height:8px;border-radius:4px;background:#0e1116;overflow:hidden}
  .factor .meter > i{display:block;height:100%}
  .up i{background:var(--red)} .down i{background:var(--blue)}
  .hint{color:var(--muted);font-size:13px;line-height:1.5;margin-top:6px}
  .pill{display:inline-block;font-size:11px;color:var(--muted);border:1px solid var(--line);
    border-radius:20px;padding:2px 9px;margin-top:8px}
  .spin{display:inline-block;width:16px;height:16px;border:2px solid var(--line);
    border-top-color:var(--accent);border-radius:50%;animation:s .8s linear infinite}
  @keyframes s{to{transform:rotate(360deg)}}
  /* layer toggle */
  .layers{position:absolute;top:62px;left:18px;z-index:1000;display:flex;gap:6px;
    background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:4px}
  .layers button{background:none;border:0;color:var(--muted);padding:6px 12px;border-radius:7px;
    cursor:pointer;font-size:13px;font-weight:600}
  .layers button.on{background:var(--accent);color:#1a1109}
  /* tier legend */
  .legend{min-width:208px}
  .legend .legtitle{font-weight:700;font-size:12.5px;margin-bottom:6px;color:var(--txt)}
  .legrow{display:flex;align-items:center;gap:8px;margin:3px 0;font-size:12px}
  .legrow .sw{width:14px;height:14px;border-radius:3px;flex:none}
  .legrow .nm{flex:1}
  .legrow .rng{color:var(--muted);font-variant-numeric:tabular-nums}
  .legu{color:var(--muted);font-size:10.5px;margin-top:7px;line-height:1.35}
  /* panel: tier badge + metrics + actions */
  .tierbadge{display:inline-block;font-weight:800;font-size:16px;letter-spacing:.5px;
    padding:6px 14px;border-radius:7px;margin:6px 0 14px;text-transform:uppercase;
    background:#0e1116;border:1px solid currentColor}
  .metric{font-size:13px;margin:2px 0;color:var(--muted)}
  .metric .mv{font-size:30px;font-weight:800;color:var(--txt);margin-right:5px}
  .metric2{font-size:13px;margin:3px 0}
  .metric2 b{color:var(--txt)}
  .act{background:#0e1116;border:1px solid var(--line);border-left:3px solid var(--accent);
    border-radius:7px;padding:9px 11px;margin:7px 0}
  .act b{display:block;font-size:13px;margin-bottom:2px}
  .act span{font-size:12.5px;color:var(--muted);line-height:1.45}
  .timing{background:rgba(238,126,43,.12);border:1px solid var(--accent);border-radius:8px;
    padding:9px 11px;margin:12px 0;font-size:12.5px;color:#ffd9b3;line-height:1.45}
</style>
</head>
<body>
<div id="map"></div>
<header>
  <h1><span class="fire">&#128293;</span> PyroCast <span style="font-weight:400;color:var(--muted)">| Florida wildfire-ignition risk</span></h1>
  <div class="sub" id="sub">loading risk map…</div>
</header>
<div class="layers">
  <button id="lIgnition" class="on" onclick="setLayer('ignition')">Ignition likelihood</button>
  <button id="lPriority" onclick="setLayer('priority')" title="ignition risk combined with people & property exposed">People &amp; property</button>
</div>
<div class="modes">
  <button id="mPoint" class="on" onclick="setMode('point')">Point</button>
  <button id="mArea" onclick="setMode('area')">Area</button>
  <span style="width:1px;background:var(--line);margin:2px 2px"></span>
  <button id="mFires" onclick="toggleFires()" title="overlay real 2017-2020 ignitions">Actual fires</button>
</div>
<div class="legend">
  <div class="legtitle" id="legTitle">Ignition likelihood</div>
  <div id="legRows"></div>
  <div class="legu" id="legUnit"></div>
</div>
<div id="panel">
  <button class="close" onclick="closePanel()">&times;</button>
  <h2 id="pTitle">Location</h2>
  <div class="loc" id="pLoc"></div>
  <div id="pBody"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
// psychology-tuned: green holds through the low/middle so average areas read calm
const STOPS=[[0,[26,125,58]],[0.5,[116,189,87]],[0.66,[205,212,81]],[0.79,[243,198,63]],[0.9,[238,126,43]],[1,[216,52,42]]];
function riskColor(r){ r=Math.max(0,Math.min(1,r));
  for(let i=1;i<STOPS.length;i++){ if(r<=STOPS[i][0]){ const p0=STOPS[i-1][0],a=STOPS[i-1][1],p1=STOPS[i][0],b=STOPS[i][1];
    const f=(r-p0)/(p1-p0); return `rgb(${a.map((c,k)=>Math.round(c+(b[k]-c)*f)).join(',')})`; } }
  return 'rgb(216,52,42)'; }

const CARTO_KEY='cb1_49n3_1_5dc0131e18da6bcb7a9c600f';   // CARTO basemap key (client-side, restrict by domain in CARTO dashboard)
const map = L.map('map',{zoomControl:true,preferCanvas:true,maxZoom:18}).setView([27.8,-82.5],7);
L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png?key='+CARTO_KEY,
  {attribution:'&copy; OpenStreetMap &copy; CARTO',maxZoom:18}).addTo(map);
const canvas = L.canvas({padding:0.5});
let MODE='point';
function setMode(m){MODE=m; document.getElementById('mPoint').classList.toggle('on',m==='point');
  document.getElementById('mArea').classList.toggle('on',m==='area');}

let riskOverlay=null, META=null, LAYER='ignition';
fetch('/api/risk').then(r=>r.json()).then(d=>{
  if(d.error){document.getElementById('sub').textContent=d.error;return;}
  META=d.meta; const c=META.calib;
  document.getElementById('sub').innerHTML =
    `${META.n_points.toLocaleString()} cells · calibrated to ${c.total_actual_ignitions.toLocaleString()} real 2017-20 ignitions · <b>click to analyze</b>`;
  setLayer('ignition');
  map.fitBounds(META.bounds, {padding:[10,10]});
}).catch(e=>document.getElementById('sub').textContent='failed to load risk map');

function setLayer(name){
  if(!META) return;
  LAYER=name;
  document.getElementById('lIgnition').classList.toggle('on',name==='ignition');
  document.getElementById('lPriority').classList.toggle('on',name==='priority');
  if(riskOverlay) map.removeLayer(riskOverlay);
  riskOverlay=L.imageOverlay('/data/'+META.layers[name].png+'?t='+Date.now(), META.bounds,
    {opacity:0.9, interactive:false}).addTo(map);
  buildLegend(name);
}
function buildLegend(name){
  const c=META.calib;
  document.getElementById('legTitle').textContent=META.layers[name].title;
  document.getElementById('legRows').innerHTML = c.tiers.slice().reverse().map(t=>{
    const rng = name==='ignition' ? `<span class="rng">${t.rate.toFixed(1)}</span>` : '';
    return `<div class="legrow"><span class="sw" style="background:${t.color}"></span><span class="nm">${t.name}</span>${rng}</div>`;
  }).join('');
  document.getElementById('legUnit').textContent = name==='ignition'
    ? `observed ignitions / 100 km²·yr (FPA-FOD 2017-20) · FL avg ${c.avg_rate_100km2_yr}`
    : 'ignition risk × people & property exposed (where to act first)';
}

map.on('click', e=>{
  const lon=e.latlng.lng, lat=e.latlng.lat;
  openPanel(lon,lat);
  const body={lon,lat, radius_km: MODE==='area'?25:0};
  fetch('/api/explain',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})
    .then(r=>r.json()).then(renderExplain).catch(()=>{document.getElementById('pBody').innerHTML='<div class="hint">Could not analyze this location.</div>';});
});

function openPanel(lon,lat){
  document.getElementById('panel').classList.add('open');
  document.getElementById('pTitle').textContent = MODE==='area'?'Area analysis':'Location';
  document.getElementById('pLoc').textContent = `${lat.toFixed(3)}, ${lon.toFixed(3)}` + (MODE==='area'?' · ~25 km radius':'');
  document.getElementById('pBody').innerHTML='<div style="margin-top:12px"><span class="spin"></span></div>';
}
function closePanel(){document.getElementById('panel').classList.remove('open');}

const TIERCOL={'Minimal':'#1a7d3a','Low':'#74bd57','Moderate':'#cdd451','High':'#f3c63f','Very High':'#ee7e2b','Extreme':'#d8342a'};
function renderExplain(d){
  if(d.error){document.getElementById('pBody').innerHTML=`<div class="hint">${d.error}</div>`;return;}
  const onP = (LAYER==='priority');
  const tname = (onP && d.ptier_name) ? d.ptier_name : (d.tier_name||'—');
  const tcol = TIERCOL[tname] || '#8b949e';
  const rate=(d.rate==null?0:d.rate), lo=d.rate_lo, hi=d.rate_hi;
  let h = `<div class="tierbadge" style="color:${tcol}">${tname}${onP?' priority':''}</div>`;
  h += `<div class="metric"><span class="mv">${rate.toFixed(1)}</span>ignitions / 100 km²·yr`
     + `${(lo!=null&&hi!=null)?` <span style="color:var(--muted)">(${lo.toFixed(1)}–${hi.toFixed(1)})</span>`:''}</div>`;
  h += `<div class="metric2"><b>${(d.rel_risk==null?0:d.rel_risk).toFixed(1)}×</b> the Florida average`
     + `${META.calib?` (avg ${META.calib.avg_rate_100km2_yr})`:''}${d.n_points?` · ${d.n_points} cells`:''}</div>`;
  if(d.exposure!=null){
    const ex=d.exposure, exl = ex>0.75?'high':ex>0.5?'moderate':'lower';
    h += `<div class="metric2" style="color:var(--muted)">People &amp; property exposed: <b>${exl}</b>${d.ptier_name?` · mitigation priority <b>${d.ptier_name}</b>`:''}</div>`;
  }
  if(d.weather_driven) h += `<div class="timing">Much of the risk here is <b>weather-driven</b> (drought, heat, low humidity), so it rises and falls with conditions — relevant for timing burn restrictions and crew readiness.</div>`;
  const place=d.place||[], cond=d.conditions||[];
  const maxE = Math.max(0.0001, ...place.concat(cond).map(x=>Math.abs(x.effect)));
  if(place.length){ h+='<div class="sec">Why here — the landscape</div>'; place.forEach(f=>h+=factorRow(f.factor,f.effect,maxE)); }
  if(cond.length){ h+='<div class="sec">Weather &amp; drought (this snapshot)</div>'; cond.forEach(f=>h+=factorRow(f.factor,f.effect,maxE)); }
  h += '<div class="sec">What can reduce risk here</div>';
  if((d.actions||[]).length) d.actions.forEach(a=>h+=`<div class="act"><b>${a.driver}</b><span>${a.do}</span></div>`);
  else h += '<div class="hint">Risk here is driven mainly by fixed terrain or weather — limited permanent mitigation; focus on detection &amp; response readiness.</div>';
  h += '<div class="hint" style="margin-top:16px">Rate = the observed ignition rate for this tier (FPA-FOD 2017-20) with its 95% range. "Why" factors come from removing each group and re-running the model; red raises risk, blue lowers it.</div>';
  document.getElementById('pBody').innerHTML=h;
}
function factorRow(name,eff,maxE){
  const up=eff>=0, w=Math.round(Math.min(1,Math.abs(eff)/maxE)*100);
  return `<div class="factor ${up?'up':'down'}"><div class="row"><b>${name}</b><span>${up?'raises':'lowers'}</span></div>
    <div class="meter"><i style="width:${w}%"></i></div></div>`;
}
// actual recorded fires overlay
let firesLayer=null, firesOn=false;
function toggleFires(){
  firesOn=!firesOn; document.getElementById('mFires').classList.toggle('on',firesOn);
  if(firesOn){
    if(!firesLayer){
      firesLayer=L.layerGroup();
      fetch('/api/ignitions').then(r=>r.json()).then(d=>{
        (d.points||[]).forEach(p=>L.circleMarker([p.lat,p.lon],{renderer:canvas,radius:1.6,stroke:false,
          fillColor:'#27e0ff',fillOpacity:0.55}).addTo(firesLayer));
        document.getElementById('sub').innerHTML += ` · <span style="color:#27e0ff">${(d.n||0).toLocaleString()} real 2017-20 fires shown</span>`;
      });
    }
    firesLayer.addTo(map);
  } else if(firesLayer){ map.removeLayer(firesLayer); }
}
</script>
</body>
</html>
